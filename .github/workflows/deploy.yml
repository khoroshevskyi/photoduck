# Build the Vite app and deploy it to GitHub Pages.
name: Deploy to GitHub Pages

on:
  # Runs on pushes targeting the default branch.
  # (Currently `master`; keep `main` too so it still works after you rename.)
  push:
    branches: ['main']

  # Allows you to run this workflow manually from the Actions tab.
  workflow_dispatch:

# Sets the GITHUB_TOKEN permissions to allow deployment to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment.
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      # The MediaPipe models (CDN) + wasm (from node_modules) are git-ignored,
      # so they must be re-fetched here before the build copies public/ → dist/.
      - name: Fetch MediaPipe models + wasm (self-hosted)
        run: npm run setup:models
      - name: Build
        run: npm run build
      # SPA fallback: serve the app for any unknown path.
      - name: Add 404 fallback
        run: cp dist/index.html dist/404.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
